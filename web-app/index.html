<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAIRmat Ontology Explorer</title>
    <!-- Load D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Load N3.js for TTL Parsing -->
    <script src="https://unpkg.com/n3/browser/n3.min.js"></script>
    <style>
        :root {
            /* FAIRmat & UI Theme Colors */
            --fairmat-navy: #002B49;
            --fairmat-blue: #00A1E0;
            --bg-light: #F8F9FA;
            --bg-panel: #FFFFFF;
            --text-dark: #333333;
            --text-muted: #6C757D;
            --border-color: #DEE2E6;
            --pill-bg: #E9ECEF;
            --pill-hover: #D3D9DF;
            
            /* Node Type Colors */
            --c-class: #00A1E0;        /* Blue */
            --c-obj-prop: #E87722;     /* Orange */
            --c-data-prop: #6A9A1F;    /* Green */
            --c-anno-prop: #9B59B6;    /* Purple */
            --c-individual: #E74C3C;   /* Red */
            --c-restriction: #F1C40F;  /* Yellow */
            --c-bnode: #95A5A6;        /* Gray */
            --c-unknown: #BDC3C7;      /* Silver */
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; background-color: var(--bg-light); color: var(--text-dark);
            display: flex;
        }

        /* --- LEFT SIDEBAR (Overview) --- */
        #sidebar {
            width: 340px; background: var(--bg-panel); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.02); z-index: 10;
            height: 100vh; box-sizing: border-box; overflow: hidden;
        }
        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: var(--fairmat-navy); }

        /* Scrollable Sidebar Content Area */
        .sidebar-scroll-area {
            flex: 1; overflow-y: auto; padding-bottom: 20px;
        }
        .sidebar-scroll-area::-webkit-scrollbar { width: 6px; }
        .sidebar-scroll-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .section { padding: 10px 20px; display: flex; flex-direction: column; }
        .section-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; color: var(--text-dark); }
        
        .pill-container { 
            display: flex; flex-wrap: wrap; gap: 8px; 
            max-height: 140px; overflow-y: auto; transition: max-height 0.3s ease;
            background: #fafafa; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;
        }
        .pill-container::-webkit-scrollbar { width: 4px; }
        .pill-container::-webkit-scrollbar-thumb { background: #bbb; border-radius: 3px; }
        
        .pill {
            background: var(--pill-bg); color: var(--text-dark); padding: 4px 10px; border-radius: 12px;
            font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: all 0.2s; user-select: none;
            border: 1px solid transparent; white-space: nowrap;
        }
        .pill:hover { background: var(--pill-hover); }
        .pill.active { background: var(--fairmat-blue); color: #fff; box-shadow: 0 2px 5px rgba(0,161,224,0.3); }

        /* --- MAIN AREA --- */
        #main-area { flex: 1; display: flex; flex-direction: column; position: relative; height: 100vh; overflow: hidden; }

        /* Top Toolbar */
        #toolbar {
            height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: center;
            background: var(--bg-panel); border-bottom: 1px solid var(--border-color); z-index: 5; flex-shrink: 0;
        }
        .search-container { position: relative; width: 400px; }
        .search-container input {
            width: 100%; padding: 10px 15px 10px 35px; border: 1px solid var(--border-color); border-radius: 20px;
            background: var(--pill-bg); font-size: 0.9rem; outline: none; box-sizing: border-box; transition: all 0.2s;
        }
        .search-container input:focus { border-color: var(--fairmat-blue); background: #fff; box-shadow: 0 0 0 3px rgba(0,161,224,0.1); }
        .search-container svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--text-muted); }

        .toolbar-actions { position: absolute; right: 20px; display: flex; gap: 15px; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 5px; color: var(--text-muted); }
        .icon-btn:hover { color: var(--fairmat-blue); }

        /* Canvas Container */
        #canvas-wrapper { flex: 1; position: relative; cursor: grab; background: var(--bg-light); overflow: hidden; }
        #canvas-wrapper:active { cursor: grabbing; }
        canvas { display: block; width: 100%; height: 100%; }

        /* --- LEGEND --- */
        #legend {
            position: absolute; bottom: 20px; left: 20px; background: rgba(255,255,255,0.95);
            padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); pointer-events: none; z-index: 5;
        }
        .legend-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; color: var(--fairmat-navy); }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; margin-bottom: 5px; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; }

        /* --- RIGHT PANEL (Code & Details) --- */
        #detail-panel {
            position: absolute; top: 0; right: -420px; width: 400px; height: 100%;
            background: var(--bg-panel); border-left: 1px solid var(--border-color);
            box-shadow: -2px 0 10px rgba(0,0,0,0.05); z-index: 20;
            transition: right 0.3s ease; display: flex; flex-direction: column;
        }
        #detail-panel.open { right: 0; }
        
        .detail-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--fairmat-navy); color: #fff;
        }
        .detail-header h3 { margin: 0; font-size: 1rem; font-weight: 600; word-break: break-all; }
        .close-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.2rem; }

        .detail-content { flex: 1; overflow-y: auto; padding: 20px; }
        .detail-group { margin-bottom: 20px; }
        .detail-group h4 { margin: 0 0 8px 0; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
        .detail-row { font-size: 0.85rem; margin-bottom: 6px; line-height: 1.4; word-break: break-word; }
        .detail-row strong { color: var(--fairmat-navy); }

        .code-block {
            background: #272822; color: #f8f8f2; padding: 15px; border-radius: 6px;
            font-family: 'Consolas', 'Courier New', monospace; font-size: 0.8rem;
            overflow-x: auto; white-space: pre; line-height: 1.5;
        }
        .code-keyword { color: #f92672; }
        .code-uri { color: #a6e22e; }
        .code-literal { color: #e6db74; }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Overview</h2>
        </div>
        
        <div class="sidebar-scroll-area">
            <div class="section">
                <div class="section-title">Nodes</div>
                <div class="pill-container" id="node-pills"></div>
            </div>

            <div class="section">
                <div class="section-title">Relations</div>
                <div class="pill-container" id="relation-pills"></div>
            </div>
        </div>
    </div>

    <!-- MAIN AREA -->
    <div id="main-area">
        <div id="toolbar">
            <div class="search-container">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="global-search" placeholder="Search classes, properties, individuals...">
            </div>
            <div class="toolbar-actions">
                <button class="icon-btn" id="toggle-code-btn" title="Toggle Detail Panel">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                </button>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="graph-canvas"></canvas>

            <!-- LEGEND -->
            <div id="legend">
                <div class="legend-title">OWL2 Types</div>
            </div>

            <!-- RIGHT PANEL -->
            <div id="detail-panel">
                <div class="detail-header">
                    <h3 id="panel-title">Select a Node</h3>
                    <button class="close-btn" id="close-panel-btn">✕</button>
                </div>
                <div class="detail-content" id="panel-content">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Select nodes to view annotations and RAW TTL.</p>
                </div>
            </div>
        </div>
    </div>

<script>
let rawQuads = []; 
let fullGraph = { nodes: new Map(), links: [] };
let filteredData = { nodes: [], links: [] };

let activeSearch = "";
let activeNodeFilters = new Set();
let activeRelFilters = new Set();
let selectedNode = null; 

let simulation, transform = d3.zoomIdentity;
const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const wrapper = document.getElementById('canvas-wrapper');
let width, height;

const TYPE_COLORS = {
    'Class': '#00A1E0',
    'ObjectProperty': '#E87722',
    'DatatypeProperty': '#6A9A1F',
    'AnnotationProperty': '#9B59B6',
    'NamedIndividual': '#E74C3C',
    'Restriction': '#F1C40F',
    'BNode': '#95A5A6',
    'Unknown': '#BDC3C7'
};

const prefixes = {
    "rdfs": "http://www.w3.org/2000/01/rdf-schema#",
    "skos": "http://www.w3.org/2004/02/skos/core#",
    "owl": "http://www.w3.org/2002/07/owl#",
    "tax": "http://fairmat-nfdi.eu/taxonomy/",
    "qudt": "http://qudt.org/2.1/schema/qudt/",
    "qk": "http://qudt.org/vocab/quantitykind/"
};

function getShort(uri) {
    if(uri.startsWith("_:")) return uri; 
    for (const [prefix, url] of Object.entries(prefixes)) {
        if (uri.startsWith(url)) return prefix + ":" + uri.replace(url, "");
    }
    if (uri.includes('#')) return uri.split('#').pop();
    if (uri.includes('/')) return uri.split('/').pop();
    return uri;
}

async function loadOntology() {
    try {
        const response = await fetch('./main.ttl');
        if (!response.ok) throw new Error("Network response failed");
        const ttlString = await response.text();
        parseTTL(ttlString);
    } catch (e) {
        console.error("Could not fetch main.ttl relative path", e);
    }
}

function parseTTL(ttlString) {
    const parser = new N3.Parser();
    fullGraph.nodes.clear();
    fullGraph.links = [];
    rawQuads = [];
    activeNodeFilters.clear();
    activeRelFilters.clear();

    const getNode = (id) => {
        if (!fullGraph.nodes.has(id)) {
            let label = getShort(id);
            let type = id.startsWith("_:") ? 'BNode' : 'Unknown';
            fullGraph.nodes.set(id, { id: id, label: label, annotations: {}, owlType: type });
        }
        return fullGraph.nodes.get(id);
    };

    parser.parse(ttlString, (error, quad) => {
        if (error) return console.error("Failed to parse TTL.");
        if (quad) {
            rawQuads.push(quad);
            const s = quad.subject.value;
            const p = quad.predicate.value;
            const o = quad.object.value;
            
            const subjNode = getNode(s);
            
            if (quad.object.termType === 'Literal') {
                const prop = getShort(p);
                if (!subjNode.annotations[prop]) subjNode.annotations[prop] = [];
                subjNode.annotations[prop].push(o);
                if (p.includes('label')) subjNode.label = getShort(s).split(':')[0] + ':' + o; 
            } else {
                if (p === 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type') {
                    subjNode.owlType = getShort(o).replace('owl:', '');
                    if(subjNode.owlType === 'Restriction') subjNode.label = "[Restriction]";
                } else {
                    getNode(o); 
                    fullGraph.links.push({ source: s, target: o, type: getShort(p) });
                }
            }
        } else {
            buildLegend();
            buildSidebar();
            applyFilters();
        }
    });
}

function buildLegend() {
    const lg = document.getElementById('legend');
    lg.innerHTML = '<div class="legend-title">OWL2 Types</div>';
    Object.keys(TYPE_COLORS).forEach(type => {
        lg.innerHTML += `<div class="legend-item"><div class="legend-color" style="background:${TYPE_COLORS[type]}"></div><span>${type}</span></div>`;
    });
}

function buildSidebar() {
    let nodesList = Array.from(fullGraph.nodes.values())
        .filter(n => !n.id.startsWith("_:"))
        .map(n => n.label).sort();
    
    let relsList = Array.from(new Set(fullGraph.links.map(l => l.type))).sort();

    renderPillGroup('node-pills', nodesList, activeNodeFilters);
    renderPillGroup('relation-pills', relsList, activeRelFilters);
}

function renderPillGroup(containerId, dataList, activeSet) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    dataList.forEach(item => {
        const el = document.createElement('div');
        el.className = `pill ${activeSet.has(item) ? 'active' : ''}`;
        el.textContent = item;
        el.onclick = () => {
            activeSet.has(item) ? activeSet.delete(item) : activeSet.add(item);
            el.classList.toggle('active');
            applyFilters();
        };
        container.appendChild(el);
    });
}

function applyFilters() {
    const q = activeSearch.toLowerCase();
    let validNodes = Array.from(fullGraph.nodes.values());
    let validLinks = fullGraph.links;

    if (q) {
        validNodes = validNodes.filter(n => n.label.toLowerCase().includes(q));
    }

    if (activeNodeFilters.size > 0) {
        let neighborIds = new Set();
        validLinks.forEach(l => {
            const sLab = fullGraph.nodes.get(l.source.id || l.source).label;
            const tLab = fullGraph.nodes.get(l.target.id || l.target).label;
            if (activeNodeFilters.has(sLab)) neighborIds.add(tLab);
            if (activeNodeFilters.has(tLab)) neighborIds.add(sLab);
        });
        validNodes = validNodes.filter(n => activeNodeFilters.has(n.label) || neighborIds.has(n.label));
    }

    if (activeRelFilters.size > 0) {
        validLinks = validLinks.filter(l => activeRelFilters.has(l.type));
    }

    const validIds = new Set(validNodes.map(n => n.id));
    filteredData.links = validLinks.filter(l => validIds.has(l.source.id || l.source) && validIds.has(l.target.id || l.target));
    
    if(activeRelFilters.size > 0) {
        const connectedIds = new Set();
        filteredData.links.forEach(l => { connectedIds.add(l.source.id || l.source); connectedIds.add(l.target.id || l.target); });
        filteredData.nodes = validNodes.filter(n => connectedIds.has(n.id));
    } else {
        filteredData.nodes = validNodes;
    }

    initSimulation();
}

document.getElementById('global-search').addEventListener('keyup', (e) => {
    activeSearch = e.target.value; applyFilters();
});

const panel = document.getElementById('detail-panel');
document.getElementById('toggle-code-btn').addEventListener('click', () => panel.classList.toggle('open'));
document.getElementById('close-panel-btn').addEventListener('click', () => { panel.classList.remove('open'); selectedNode = null; draw(); });

function reconstructTTL(nodeId) {
    const nodeQuads = rawQuads.filter(q => q.subject.value === nodeId);
    if (nodeQuads.length === 0) return "# Blank Node or No Data";
    let ttl = `<span class="code-uri">${getShort(nodeId)}</span>`;
    const grouped = {};
    nodeQuads.forEach(q => {
        const p = getShort(q.predicate.value);
        if (!grouped[p]) grouped[p] = [];
        let objStr = q.object.termType === 'Literal' ? 
            `<span class="code-literal">"${q.object.value}"</span>${q.object.language ? '@'+q.object.language : ''}` : 
            `<span class="code-uri">${getShort(q.object.value)}</span>`;
        grouped[p].push(objStr);
    });
    Object.keys(grouped).forEach((p, i, arr) => {
        ttl += `\n    <span class="code-keyword">${p==='rdf:type'?'a':p}</span> ${grouped[p].join(', ')}`;
        ttl += (i === arr.length - 1) ? ` .` : ` ;`;
    });
    return ttl;
}

function updateRightPanel(d) {
    if (!d) return;
    document.getElementById('panel-title').textContent = d.label;
    let html = `<div class="detail-group"><h4>Annotations</h4>`;
    const annos = Object.entries(d.annotations);
    if(annos.length) annos.forEach(([k, v]) => html += `<div class="detail-row"><strong>${k}:</strong> ${v.join(', ')}</div>`);
    else html += `<div class="detail-row">None</div>`;
    html += `</div><div class="detail-group"><h4>Raw TTL</h4><div class="code-block">${reconstructTTL(d.id)}</div></div>`;
    document.getElementById('panel-content').innerHTML = html;
    panel.classList.add('open');
}

function resize() {
    width = wrapper.clientWidth; height = wrapper.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr; canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    if (simulation) { simulation.force("center", d3.forceCenter(width/2, height/2)); simulation.alpha(0.3).restart(); }
    draw();
}
window.addEventListener('resize', resize);

function initSimulation() {
    if (simulation) simulation.stop();
    const nodes = filteredData.nodes.map(d => Object.assign({}, d));
    const links = filteredData.links.map(d => Object.assign({}, d));

    simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(150))
        .force("charge", d3.forceManyBody().strength(-800))
        .force("collide", d3.forceCollide().radius(35).iterations(4))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .on("tick", draw);

    d3.select(canvas)
        .call(d3.zoom().scaleExtent([0.1, 4]).on("zoom", e => { transform = e.transform; draw(); }))
        .call(d3.drag().subject(e => simulation.find(transform.invertX(e.x), transform.invertY(e.y), 20))
            .on("start", e => { if(!e.active) simulation.alphaTarget(0.3).restart(); e.subject.fx=e.subject.x; e.subject.fy=e.subject.y; })
            .on("drag", e => { e.subject.fx = transform.invertX(e.x); e.subject.fy = transform.invertY(e.y); })
            .on("end", e => { if(!e.active) simulation.alphaTarget(0); e.subject.fx=null; e.subject.fy=null; })
        );

    d3.select(canvas).on("click", (event) => {
        const [mx, my] = d3.pointer(event);
        const clicked = simulation.find(transform.invertX(mx), transform.invertY(my), 15);
        selectedNode = clicked;
        clicked ? updateRightPanel(clicked) : panel.classList.remove('open');
        draw();
    });
}

function drawArrow(ctx, source, target, radius) {
    const dx = target.x - source.x, dy = target.y - source.y;
    const angle = Math.atan2(dy, dx);
    const targetX = target.x - Math.cos(angle) * radius;
    const targetY = target.y - Math.sin(angle) * radius;
    
    ctx.beginPath(); ctx.moveTo(source.x, source.y); ctx.lineTo(targetX, targetY); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(targetX, targetY);
    ctx.lineTo(targetX - 8 * Math.cos(angle - Math.PI/6), targetY - 8 * Math.sin(angle - Math.PI/6));
    ctx.lineTo(targetX - 8 * Math.cos(angle + Math.PI/6), targetY - 8 * Math.sin(angle + Math.PI/6));
    ctx.fill();
}

function draw() {
    ctx.fillStyle = "#F8F9FA"; ctx.fillRect(0, 0, width, height);
    ctx.save(); ctx.translate(transform.x, transform.y); ctx.scale(transform.k, transform.k);

    ctx.strokeStyle = "#ccc"; ctx.fillStyle = "#ccc"; ctx.lineWidth = 1.5;
    
    if (simulation && simulation.force("link")) {
        simulation.force("link").links().forEach(d => {
            if (d.source.x !== undefined && d.target.x !== undefined) {
                drawArrow(ctx, d.source, d.target, 12);
                if (transform.k > 0.6) {
                    ctx.fillStyle = "#888"; ctx.font = "10px sans-serif";
                    ctx.fillText(d.type, (d.source.x + d.target.x)/2, (d.source.y + d.target.y)/2 - 5);
                    ctx.fillStyle = "#ccc";
                }
            }
        });
    }

    if (simulation) {
        simulation.nodes().forEach(d => {
            if (d.x !== undefined && d.y !== undefined) {
                ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, 2*Math.PI);
                ctx.fillStyle = TYPE_COLORS[d.owlType] || TYPE_COLORS['Unknown']; 
                ctx.fill();

                if (selectedNode && selectedNode.id === d.id) {
                    ctx.strokeStyle = "#002B49"; ctx.lineWidth = 3; ctx.stroke();
                    ctx.beginPath(); ctx.arc(d.x, d.y, 18, 0, 2*Math.PI);
                    ctx.strokeStyle = "rgba(0, 161, 224, 0.5)"; ctx.lineWidth = 3; ctx.stroke();
                } else {
                    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
                }
                
                ctx.fillStyle = "#333"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(d.label, d.x, d.y + 24);
            }
        });
    }

    ctx.restore();
}

resize();
loadOntology();
</script>
</body>
</html>
